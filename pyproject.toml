[project]
name = "arabic-commerce-copilot"
version = "0.1.0"
description = "Arabic-first commerce assistant: dialect-aware hybrid retrieval, tool-using agent, eval-as-product."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.60",        # OpenAI-compatible endpoint: Ollama locally, Azure OpenAI in the cloud
  "anthropic>=0.70",     # Claude provider (official SDK)
  "mcp>=2.0",            # Model Context Protocol server (2.x: MCPServer) exposing the copilot's tools
  "cloudkit",            # azure-local-lab adapters (local <-> Azure by CLOUDKIT_MODE)
  "opentelemetry-sdk>=1.29",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]

[tool.uv.sources]
cloudkit = { path = "../azure-local-lab", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running LLM/embedding endpoint (Ollama)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Arabic glyphs are not "ambiguous"; ruff format owns line length
